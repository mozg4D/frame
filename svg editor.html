<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVG icon editor</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#222;color:#ddd;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace}
  #app{display:flex;gap:16px;padding:14px;align-items:flex-start;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:10px}
  #big{width:min(1200px,calc(100vh - 140px),calc(100vw - 360px));height:min(1200px,calc(100vh - 140px),calc(100vw - 360px));
    background:#2a2a2a;border:1px solid #000;display:block;touch-action:none;box-shadow:0 0 0 1px #000,0 10px 30px #0006}
  #gridLayer line{vector-effect:non-scaling-stroke;stroke-width:1px}
  .handle{cursor:move;pointer-events:all;transition:r .06s}
  .offpt{cursor:crosshair;pointer-events:all}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .grp{display:flex;flex-direction:column;gap:4px}
  .lab{color:#e2e2e2;font-size:14px;letter-spacing:.02em}
  .hint{color:#a8a8a8;font-size:14px}
  button{background:#333;color:#ddd;border:1px solid #000;border-radius:4px;padding:4px 8px;cursor:pointer;font:inherit;transition:background .09s,transform .04s}
  button:hover{background:#444}
  button:active{background:#2c2c2c;transform:translateY(1px)}
  button.on{background:#3a3a3a;border-color:#888}
  .sw{width:18px;height:18px;border:1px solid #000;border-radius:3px;cursor:pointer;padding:0;transition:transform .07s,box-shadow .07s}
  .sw:hover{transform:scale(1.12);box-shadow:0 0 0 1px #fff6}
  .sw.on{outline:2px solid #fff;outline-offset:1px}
  select,input[type=number]{background:#333;color:#ddd;border:1px solid #000;border-radius:4px;font:inherit;padding:2px 4px}
  input[type=color]{-webkit-appearance:none;appearance:none;width:30px;height:24px;padding:0;border:1px solid #000;background:#1a1a1a;border-radius:3px;cursor:pointer;flex:0 0 auto}
  input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:2px}
  input[type=color]::-moz-color-swatch{border:none;border-radius:2px}
  #previews{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
  .pv svg{background:#1c1c1c;border:1px solid #000;display:block}
  .pv span{color:#cfcfcf;font-size:14px}
  #pvPixel{width:320px;height:320px;image-rendering:pixelated;image-rendering:crisp-edges;background:#1c1c1c;border:1px solid #000;display:block}
  #pasteBox{width:100%;height:120px;background:#1a1a1a;color:#cfcfcf;border:1px solid #000;border-radius:4px;font:14px/1.4 ui-monospace,monospace;padding:6px;resize:vertical;white-space:pre-wrap;word-break:break-all;overflow:auto}
  #pasteBox::-webkit-scrollbar{width:10px;height:10px}
  #pasteBox::-webkit-scrollbar-track{background:#141414}
  #pasteBox::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:5px;border:2px solid #141414}
  #pasteBox::-webkit-scrollbar-thumb:hover{background:#4d4d4d}
  #pasteBox{scrollbar-width:thin;scrollbar-color:#3a3a3a #141414}
</style>
</head>
<body>
<div id="app">
  <div class="col">
    <div class="row">
      <select id="iconSelect" style="width:130px"></select>
      <button id="addIconBtn" title="create new empty icon">+ icon</button>
      <button id="delIconBtn" title="delete current icon">×</button>
      <button id="openIconsBtn">Open icons.js</button>
      <button id="saveIconsBtn">Save icons.js</button>
    </div>
    <div class="row">
      <button class="tool on" data-tool="select">Select</button>
      <button class="tool" data-tool="line">Line</button>
      <button class="tool" data-tool="polyline">Polyline</button>
      <button class="tool" data-tool="rect">Rect</button>
      <button class="tool" data-tool="ellipse">Ellipse</button>
      <button class="tool" data-tool="halfellipse">½ Ellipse</button>
      <button id="layerBack" title="send backward (z-)">⇣</button>
      <button id="layerFwd" title="bring forward (z+)">⇡</button>
    </div>
    <svg id="big" viewBox="0 0 32 32">
      <rect id="bg" width="100%" height="100%" fill="transparent"/>
      <g id="gridLayer"></g>
      <g id="figLayer" style="pointer-events:none"></g>
      <g id="uiLayer" style="pointer-events:none"></g>
    </svg>
  </div>
  <div class="col">
    <div class="grp"><span class="lab">stroke</span><div class="row" id="strokeRow"></div></div>
    <div class="grp"><span class="lab">fill</span><div class="row" id="fillRow"></div></div>
    <div class="row">
      <span class="lab">palette</span>
      <input type="color" id="addColorIn" value="#000000" title="add color to palette">
      <span class="hint">right‑click swatch = remove</span>
    </div>
    <div class="row">
      <span class="lab">width</span>
      <input type="number" id="swIn" value="1.6" min="0" step="0.1" style="width:60px">
      <button class="swbtn" data-sw="0.3">.3</button><button class="swbtn" data-sw="0.4">.4</button><button class="swbtn" data-sw="0.5">.5</button>
      <button class="swbtn" data-sw="1">1</button><button class="swbtn" data-sw="1.4">1.4</button><button class="swbtn" data-sw="1.6">1.6</button>
      <button class="swbtn" data-sw="2">2</button><button class="swbtn" data-sw="2.8">2.8</button><button class="swbtn" data-sw="3.6">3.6</button><button class="swbtn" data-sw="5.2">5.2</button>
    </div>
    <div class="row">
      <span class="lab">cap</span><select id="capIn"><option>round</option><option>butt</option><option>square</option></select>
      <span class="lab">join</span><select id="joinIn"><option>round</option><option>miter</option><option>bevel</option></select>
    </div>
    <div id="previews">
      <div class="pv"><svg id="pv32" viewBox="0 0 32 32" width="32" height="32" fill="none"></svg></div>
      <div class="pv"><canvas id="pvPixel" width="32" height="32"></canvas></div>
    </div>
    <div class="grp">
      <span class="lab">code of current icon — edit / paste const ICO_… = `&lt;svg&gt;` to update</span>
      <textarea id="pasteBox" spellcheck="false"></textarea>
    </div>
  </div>
</div>
<script>

function savePalette(){ try{ localStorage.setItem('iconEditorPalette',JSON.stringify(palette)); }catch(e){} }
let palette=loadPalette();

const ORDER=['ICO_GRID','ICO_MAGNET','ICO_GLOBE','ICO_ARROW','ICO_CUBE','ICO_SQUARE','ICO_PERSON','ICO_NEW','ICO_OPEN','ICO_SAVE','ICO_SAVEAS','ICO_SAVEINC','ICO_DOWNLOAD','ICO_RECENTS','ICO_CUSTOM_1','ICO_BROWSER_FOLDED','ICO_BROWSER_UNFOLDED','ICO_CUSTOM_2','ICO_TAB_ATTRIBUTES','ICO_TAB_MATERIAL_MGR','ICO_TAB_MATERIALS','ICO_TAB_TEXTURES','ICO_TAB_OBJECTS','ICO_TAB_DELETE_UNUSED','ICO_TAB_ADD_MATERIAL'];
const ICONS={

  pvPixel=document.getElementById('pvPixel'), pvCtx=pvPixel.getContext('2d'), iconSelect=document.getElementById('iconSelect'), pasteBox=document.getElementById('pasteBox');

const addId=(s,id)=>s.replace(/^<([a-zA-Z]+)/,(m,t)=>`<${t} data-id="${id}"`);
const figObj=id=>figures.find(f=>f.id===id);

  if(key.startsWith('Arrow')&&selection.size){ e.preventDefault(); const step=e.shiftKey?5:e.altKey?0.25:0.5; let dx=0,dy=0; if(key==='ArrowLeft')dx=-step; else if(key==='ArrowRight')dx=step; else if(key==='ArrowUp')dy=-step; else if(key==='ArrowDown')dy=step; if(dx===0&&dy===0)return; pushUndo();
    if(activeHandle&&selection.size===1){ const h=handlesOf(figObj(selFirst()))[activeHandle.idx]; if(h)h.move(n(h.x+dx),n(h.y+dy)); } else selection.forEach(sid=>{ const f=figObj(sid); if(f)translateFig(f,dx,dy); }); renderAll(); } });
renderPalette(); fillIconSelect(); drawGrid(); selectIcon('ICO_GRID');
</script>
