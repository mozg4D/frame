<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="./frame-icon-v4.svg" type="image/svg+xml"><title>Scene Documentation · Frame</title><style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#1b1b1b;color:#ddd}body{margin:0;height:100dvh;display:flex;flex-direction:column}textarea{flex:1;min-height:0;resize:none;border:0;outline:0;background:transparent;color:inherit;font:inherit;line-height:1.55;padding:24px;white-space:pre-wrap;overflow-wrap:anywhere}output{font-size:12px;padding:8px 24px;color:#aaa}output[data-error=true]{color:#ffbc88}</style></head><body><textarea aria-label="Scene documentation" spellcheck="false" disabled></textarea><output hidden></output><script type="module">
import {installDocumentationGeometry} from './core/documentation-geometry.mjs';

// Documentation synchronization.
const {edit,selectionAfter,presentation,rebase,draftLimit,rescueRecord,readRescue,session}=(()=>{
// One contiguous edit envelope. Conservative: overlapping envelopes conflict.
const splitPair=(s,i)=>i>0&&i<s.length&&/[\uD800-\uDBFF]/.test(s[i-1])&&/[\uDC00-\uDFFF]/.test(s[i]);
function edit(base,text){let start=0,end=base.length,tail=text.length;while(start<end&&start<tail&&base[start]===text[start])start++;while(end>start&&tail>start&&base[end-1]===text[tail-1]){end--;tail--;}if(splitPair(base,start)||splitPair(text,start))start--;if(splitPair(base,end))end++;if(splitPair(text,tail))tail++;return {start,end,text:text.slice(start,tail)};}
// Insertions at a boundary have right affinity. Positions inside a replacement
// move to its end; the left edge of a nonempty replacement stays at its start.
function selectionAfter(base,text,start,end,direction='none'){
 const e=edit(base,text),delta=e.text.length-(e.end-e.start),map=p=>p<e.start?p:p>=e.end?p+delta:p===e.start?e.start:e.start+e.text.length;
 let a=Math.max(0,Math.min(text.length,map(start))),b=Math.max(0,Math.min(text.length,map(end)));
 if(start===end){if(splitPair(text,a))a++;b=a;}else{if(splitPair(text,a))a--;if(splitPair(text,b))b++;}
 return {start:a,end:b,direction};
}
function presentation(s){return {disabled:!s.editable&&!s.text&&!s.pending&&!s.dirty&&!s.fault,readOnly:!!s.fault,message:s.fault||''};}

function rebase(base,local,remote){
 if(local===base)return remote;if(remote===base||local===remote)return local;
 const a=edit(base,local),b=edit(base,remote);
 // Same-position insertions and touching edit boundaries are intentionally ambiguous.
 if(a.end<b.start)return remote.slice(0,a.start)+a.text+remote.slice(a.end);
 if(b.end<a.start){const shift=b.text.length-(b.end-b.start),start=a.start+shift,end=a.end+shift;return remote.slice(0,start)+a.text+remote.slice(end);}
 throw Error('Concurrent changes overlap. Your draft is retained; copy it before reopening.');
}
const epoch=s=>s.version.slice(0,s.version.lastIndexOf(':'));
const newer=(a,b)=>epoch(a)!==epoch(b)||Number(a.version.split(':').at(-1))>Number(b.version.split(':').at(-1));
// A single bounded, plain-text sessionStorage record. The body is not JSON
// escaped, so every valid 1 Mi UTF-16 document has the same storage bound.
const draftLimit=1048576;
function rescueRecord({text,version},token,{start,end,direction}){
 if(typeof text!=='string'||text.length>draftLimit)throw Error('Draft exceeds recovery limit');
 const header=JSON.stringify({format:1,token,version,start,end,direction});
 if(header.length>2048)throw Error('Invalid recovery metadata');
 return header+'\n'+text;
}
function readRescue(raw,token){
 if(raw===null)return null;
 if(typeof raw!=='string'||raw.length>draftLimit+2049)throw Error('Invalid recovery record');
 const split=raw.indexOf('\n');if(split<0||split>2048)throw Error('Invalid recovery header');
 const h=JSON.parse(raw.slice(0,split)),text=raw.slice(split+1);
 if(h.format!==1||typeof h.token!=='string'||typeof h.version!=='string'||h.version.length>256||!h.version.includes(':')||text.length>draftLimit||!Number.isSafeInteger(h.start)||!Number.isSafeInteger(h.end)||h.start<0||h.end<h.start||h.end>text.length||!['none','forward','backward'].includes(h.direction))throw Error('Invalid recovery draft');
 return h.token===token?{text,version:h.version,start:h.start,end:h.end,direction:h.direction}:null;
}
function session({send,changed}){
 let base=null,draft='',pending=null,latest=null,heldReply=null,fault='',next=0,editable=false,held=false;
 const emit=()=>changed({text:draft,editable,version:base?.version,pending:!!pending,dirty:!!base&&draft!==base.text,fault});
 // Capture is deliberately separate from submission. Even the final IME input
 // after a terminal fault belongs to this local draft, never to a newer scene.
 const capture=text=>{if(!editable||!base||text===draft)return false;draft=text;return true;};
 const fail=message=>{fault||=message;pending=null;latest=null;heldReply=null;};
 function integrate(s){if(!base){base=s;draft=s.text;editable=true;return;}if(epoch(s)!==epoch(base)){if(pending||draft!==base.text)throw Error('Scene changed. Your previous-scene draft is retained; copy it before reopening.');base=s;draft=s.text;editable=true;return;}if(!newer(s,base))return;draft=rebase(base.text,draft,s.text);base=s;editable||=!!s.text;}
 function pump(){if(fault||held||pending||!base||draft===base.text)return;pending={id:++next,text:draft,base};try{send({kind:'write',id:pending.id,text:draft,version:base.version});}catch{fail('Main scene connection failed. Draft retained here; copy it before closing.');}}
 function applyLatest(){if(latest){const s=latest;latest=null;integrate(s);}}
 function reply(m){const p=pending;pending=null;heldReply=null;try{if(m.ok){const s=m.state;if(epoch(s)!==epoch(p.base))throw Error('Scene changed while saving; draft retained.');draft=draft===p.text?s.text:rebase(p.text,draft,s.text);base=s;}else if(m.code!=='CONFLICT')throw Error((m.error||'Save failed')+' Draft retained here; copy it before reopening.');applyLatest();if(!m.ok&&base.version===p.base.version)throw Error(m.error||'Save conflict; draft retained.');pump();}catch(e){fail(e.message);}}
 return {
  capture(text){if(capture(text))emit();},
  input(text){capture(text);pump();emit();},
  hold(){held=true;},
  resume(text){capture(text);held=false;if(!fault)try{if(heldReply)reply(heldReply);else if(!pending){applyLatest();pump();}}catch(e){fail(e.message);}emit();},
  snapshot(s){if(fault)return;if(held&&base&&epoch(s)!==epoch(base)){fail('Scene changed during composition. Your previous-scene draft is retained; copy it before reopening.');emit();return;}if(held||pending){if(!latest||newer(s,latest))latest=s;emit();return;}try{integrate(s);pump();}catch(e){fail(e.message);}emit();},
  reply(m){if(fault||!pending||m.id!==pending.id)return;if(held&&(m.ok||m.code==='CONFLICT'))heldReply=m;else reply(m);emit();},
  stop(message){if(fault)return;fail(message);emit();},
  disconnect(){if(fault)return;fail('Main scene connection closed. Draft retained here; copy it before closing.');emit();},
  restore(s){if(base)return;base={text:'',version:s.version};draft=s.text;editable=true;fail('Recovered draft after reload; recovery may be incomplete. Copy it before reopening Docs; it has not been sent to the scene.');emit();},
  get state(){return {base,draft,pending,fault};}
 };
}
return {edit,selectionAfter,presentation,rebase,draftLimit,rescueRecord,readRescue,session};
})();

// Local text history.
const {history}=(()=>{
const selection=(s,text)=>({start:Math.max(0,Math.min(text.length,s.start)),end:Math.max(0,Math.min(text.length,s.end)),direction:s.direction||'none'});
const same=(a,b)=>a.start===b.start&&a.end===b.end&&a.direction===b.direction;
// Detach patch payloads: a small slice must not retain an old megabyte document.
const detach=text=>JSON.parse(JSON.stringify(text));
const delta=(before,after)=>{const e=edit(before,after);return {start:e.start,before:detach(before.slice(e.start,e.end)),after:detach(e.text)};};
const replace=(text,e,undo)=>{const from=undo?e.after:e.before,to=undo?e.before:e.after;if(text.slice(e.start,e.start+from.length)!==from)throw Error('History no longer matches');return text.slice(0,e.start)+to+text.slice(e.start+from.length);};
// Map two disjoint edits without walking/copying every historical document.
// Each entry is transformed in O(1); the remote text is diffed just once.
function commute(a,b){
 const ae=a.start+a.before.length,be=b.start+b.before.length,ad=a.after.length-a.before.length,bd=b.after.length-b.before.length;
 if(a.start===ae&&b.start===be&&a.start===b.start)throw Error('Ambiguous history insertion');
 if(ae<=b.start)return {local:a,remote:{...b,start:b.start+ad}};
 if(be<=a.start)return {local:{...a,start:a.start+bd},remote:b};
 throw Error('Remote change overlaps history');
}
function moveSelection(s,e,length){
 const end=e.start+e.before.length,d=e.after.length-e.before.length,map=p=>p<e.start?p:p>=end?p+d:p===e.start?e.start:e.start+e.after.length;
 return selection({start:map(s.start),end:map(s.end),direction:s.direction},{length});
}
// Local-only patch history. External changes transform disjoint entries; an
// overlapping historical entry and its older dependencies are dropped rather
// than reverting someone else's text. No scene history or storage is involved.
function history({limit=128,maxCharacters=4*1048576}={}){
 let current='',undo=[],redo=[],group=null;
 const trim=()=>{while(undo.length+redo.length>limit||[...undo,...redo].reduce((n,e)=>n+e.before.length+e.after.length,0)>maxCharacters){if(undo.length)undo.shift();else redo.shift();}if(group&&!undo.includes(group))group=null;};
 const entry=(before,after,a,b)=>({...delta(before,after),selectionBefore:selection(a,before),selectionAfter:selection(b,after)});
 function transform(stack,from,to,backwards){
  const out=[];let remote=delta(from,to),length=from.length;
  for(let i=stack.length-1;i>=0;i--){const e=stack[i];try{
   const local={start:e.start,before:backwards?e.after:e.before,after:backwards?e.before:e.after};
   const mapped=commute(local,remote),newLength=length+remote.after.length-remote.before.length,nextLength=length+local.after.length-local.before.length;
   const a=moveSelection(e.selectionBefore,backwards?mapped.remote:remote,backwards?nextLength+mapped.remote.after.length-mapped.remote.before.length:newLength);
   const b=moveSelection(e.selectionAfter,backwards?remote:mapped.remote,backwards?newLength:nextLength+mapped.remote.after.length-mapped.remote.before.length);
   out.push({...e,start:mapped.local.start,selectionBefore:a,selectionAfter:b});length=nextLength;remote=mapped.remote;
  }catch{break;}}
  return out.reverse();
 }
 return {
  reset(text){current=text;undo=[];redo=[];group=null;},
  remote(text){if(text===current)return;undo=transform(undo,current,text,true);redo=transform(redo,current,text,false);current=text;group=null;trim();},
  breakGroup(){group=null;},
  record(before,after,a,b,type='',time=performance.now()){
   if(before!==current)this.remote(before);
   if(before===after)return;
   const e=entry(before,after,a,b);let merge=false;
   if(group&&group.type===type&&time-group.time<=1000&&same(group.selectionAfter,e.selectionBefore)){
    if(type==='insertText'&&!group.before&&!e.before&&group.start+group.after.length===e.start&&!/\s/u.test(group.after+e.after)){group.after+=e.after;merge=true;}
    else if(type==='deleteContentBackward'&&!group.after&&!e.after&&e.start+e.before.length===group.start){group.before=e.before+group.before;group.start=e.start;merge=true;}
    else if(type==='deleteContentForward'&&!group.after&&!e.after&&e.start===group.start){group.before+=e.before;merge=true;}
   }
   if(merge){group.selectionAfter=e.selectionAfter;group.time=time;}else{group={...e,type,time};undo.push(group);}
   redo=[];current=after;trim();
  },
  step(backwards=true){
   group=null;const from=backwards?undo:redo,to=backwards?redo:undo,e=from.pop();if(!e)return null;
   try{current=replace(current,e,backwards);to.push(e);return {text:current,selection:backwards?e.selectionBefore:e.selectionAfter};}
   catch{from.length=0;return null;}
  },
  get state(){return {text:current,undo:undo.length,redo:redo.length,characters:[...undo,...redo].reduce((n,e)=>n+e.before.length+e.after.length,0)};}
 };
}
return {history};
})();

// Editor UI.
const area=document.querySelector('textarea'),status=document.querySelector('output'),token=location.hash.slice(1),rescueKey='frame-docs-draft-v1';
let port=null,composing=false,finishing=false,finishTimer=null,lastState=null,recoveryWarning='',operationWarning='',seal=null;
const undoHistory=history();let historyEpoch=null,beforeInput=null,compositionBefore=null;
const selection=()=>({start:area.selectionStart,end:area.selectionEnd,direction:area.selectionDirection});
function persist(s){
 if(!s)return;
 if(s.version){const unsafe=s.pending||s.dirty||s.fault||composing||finishing;try{if(unsafe)window.sessionStorage.setItem(rescueKey,rescueRecord(s,token,selection()));else window.sessionStorage.removeItem(rescueKey);recoveryWarning='';}catch{recoveryWarning=unsafe?'Reload recovery unavailable. Keep this window open and copy the draft before closing.':'';}}
 status.dataset.error=String(!!(s.fault||recoveryWarning));status.textContent=[s.fault,recoveryWarning].filter(Boolean).join(' ')||operationWarning||(seal?'File operation in progress. Editing is temporarily paused.':'');status.hidden=!status.textContent;
}
function paint(s){
 const epoch=s.version?.slice(0,s.version.lastIndexOf(':'));
 if(epoch&&epoch!==historyEpoch){undoHistory.reset(s.text);historyEpoch=epoch;beforeInput=null;}else if(area.value!==s.text&&!composing&&!finishing)undoHistory.remote(s.text);
 lastState=s;
 // Do not change the DOM or selection under an active native composition.
 // Terminal faults are visible immediately, but readOnly waits for its end.
 if(!composing&&!finishing&&!seal?.acknowledged){if(area.value!==s.text){const change=edit(area.value,s.text),nextSelection=selectionAfter(area.value,s.text,area.selectionStart,area.selectionEnd,area.selectionDirection);area.setRangeText(change.text,change.start,change.end,'preserve');area.setSelectionRange(nextSelection.start,nextSelection.end,nextSelection.direction);}const ui=presentation(s);area.disabled=ui.disabled;area.readOnly=ui.readOnly||!!seal;}
 persist(s);
 if(seal&&!seal.acknowledged){if(s.fault){port.postMessage({kind:'sealed',id:seal.id,ok:false,error:s.fault});seal=null;}else if(!composing&&!finishing&&!s.pending&&!s.dirty){seal.acknowledged=true;seal.text=area.value;port.postMessage({kind:'sealed',id:seal.id,ok:true,version:s.version});}}
}
const sync=session({send:m=>port.postMessage(m),changed:paint});
function capture(){sync.capture(area.value);}
function disconnect(){capture();sync.disconnect();}
function invalidateSeal(){if(!seal?.acknowledged||area.value===seal.text)return;capture();sync.stop('These later edits have not been sent to the scene. Your draft is retained; copy it before reopening.');port.postMessage({kind:'seal-invalid',id:seal.id,error:lastState.fault});}
function receive(m){
 invalidateSeal();capture();
 if(m?.kind==='seal'&&Number.isSafeInteger(m.id)){
  const blocked=seal||composing||finishing||lastState?.fault||!lastState?.version||m.mode==='replace'&&(lastState.pending||lastState.dirty);
  if(blocked){operationWarning='Finish the Docs edit, then retry this file operation. Your draft is retained.';persist(lastState);port.postMessage({kind:'sealed',id:m.id,ok:false,error:lastState?.fault||operationWarning});return;}
  operationWarning='';seal={id:m.id,acknowledged:false,snapshot:null};area.readOnly=true;sync.input(area.value);return;
 }
 if(m?.kind==='release'&&seal?.id===m.id){const snapshot=seal.snapshot;seal=null;operationWarning=typeof m.error==='string'?m.error:'';if(snapshot)sync.snapshot(snapshot);paint(lastState);return;}
 if(m?.kind==='snapshot'){if(seal?.acknowledged)seal.snapshot=m.state;else sync.snapshot(m.state);}
 else if(m?.kind==='reply')sync.reply(m);else if(m?.kind==='closed')disconnect();
}
window.addEventListener('message',event=>{if(port||event.source!==opener||event.origin!==location.origin||event.data?.kind!=='frame-docs-connect'||event.data.token!==token||event.ports.length!==1)return;port=event.ports[0];port.onmessage=event=>receive(event.data);port.onmessageerror=disconnect;});
function recordComposition(){if(compositionBefore)undoHistory.record(compositionBefore.text,area.value,compositionBefore.selection,selection(),'insertCompositionText');compositionBefore=null;beforeInput=null;}
function finishComposition(){finishTimer=null;if(!finishing)return;capture();recordComposition();finishing=false;sync.resume(area.value);}
function scheduleFinish(){if(finishTimer!==null)clearTimeout(finishTimer);finishTimer=setTimeout(finishComposition,0);}
function changeHistory(backwards){
 if(area.disabled||area.readOnly||composing||finishing||seal)return;
 const changed=undoHistory.step(backwards);if(!changed)return;
 const e=edit(area.value,changed.text);area.setRangeText(e.text,e.start,e.end,'preserve');const s=changed.selection;area.setSelectionRange(s.start,s.end,s.direction);beforeInput=null;sync.input(area.value);
}
area.addEventListener('keydown',e=>{if(composing||finishing||area.disabled||area.readOnly||seal)return;const key=e.key.toLowerCase(),shortcut=key==='z'||key==='y'?key:e.code==='KeyZ'?'z':e.code==='KeyY'?'y':key;if((e.ctrlKey||e.metaKey)&&!e.altKey&&(shortcut==='z'||shortcut==='y'&&!e.metaKey)){e.preventDefault();changeHistory(shortcut==='z'&&!e.shiftKey);return;}if(['arrowleft','arrowright','arrowup','arrowdown','home','end','pageup','pagedown'].includes(key))undoHistory.breakGroup();});
area.addEventListener('pointerdown',()=>undoHistory.breakGroup());
area.addEventListener('beforeinput',e=>{if(!composing&&!finishing&&(e.inputType==='historyUndo'||e.inputType==='historyRedo')){e.preventDefault();changeHistory(e.inputType==='historyUndo');return;}beforeInput={text:area.value,selection:selection()};});
area.addEventListener('input',e=>{if(!composing&&!finishing&&!seal?.acknowledged){const before=beforeInput||{text:undoHistory.state.text,selection:selection()};undoHistory.record(before.text,area.value,before.selection,selection(),e.inputType);}beforeInput=null;if(seal?.acknowledged){invalidateSeal();return;}if(composing||finishing){capture();if(finishing)scheduleFinish();}else sync.input(area.value);});
area.addEventListener('compositionstart',()=>{if(finishTimer!==null)clearTimeout(finishTimer);if(finishing){capture();recordComposition();}finishTimer=null;finishing=false;composing=true;compositionBefore={text:area.value,selection:selection()};undoHistory.breakGroup();sync.hold();capture();if(seal){port.postMessage({kind:'seal-invalid',id:seal.id,error:'Composition started during a file operation; draft retained.'});sync.stop('Composition started during a file operation. These later edits have not been sent to the scene. Draft retained; copy it before reopening.');}});
// Native engines differ in whether the final input precedes compositionend.
// Hold remote integration through this event turn, including its final input.
area.addEventListener('compositionend',()=>{capture();composing=false;finishing=true;scheduleFinish();});
area.addEventListener('blur',()=>{undoHistory.breakGroup();capture();if(lastState)paint(lastState);});
area.addEventListener('select',()=>persist(lastState));
window.addEventListener('beforeunload',e=>{capture();persist(lastState);if(lastState?.pending||lastState?.dirty||lastState?.fault||composing||finishing){e.preventDefault();e.returnValue='';}});
window.addEventListener('pagehide',()=>{capture();persist(lastState);if(finishTimer!==null)clearTimeout(finishTimer);finishTimer=null;port?.close();});
try{const recovered=readRescue(window.sessionStorage.getItem(rescueKey),token);if(recovered){sync.restore(recovered);area.setSelectionRange(recovered.start,recovered.end,recovered.direction);persist(lastState);}}catch{recoveryWarning='Reload recovery unavailable. Keep this window open and copy any unsaved draft before closing.';status.hidden=false;status.textContent=recoveryWarning;}
if(opener&&token){installDocumentationGeometry();opener.postMessage({kind:'frame-docs-ready',token},location.origin);}else if(!lastState){status.hidden=false;status.textContent='Open documentation from the scene’s Docs button.';}
setInterval(()=>{if(port&&(!opener||opener.closed))disconnect();},1000);
</script></body></html>
